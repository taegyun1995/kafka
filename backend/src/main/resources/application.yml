spring:
  application:
    name: popup-pass
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:popup_pass}
    username: ${DB_USERNAME:popup}
    password: ${DB_PASSWORD:popup}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
server:
  port: 18090

management:
  endpoints:
    web:
      exposure:
        include: health,info
