name: popup-pass

services:
  postgres:
    image: postgres:16-alpine
    container_name: popup-pass-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: popup_pass
      POSTGRES_USER: popup
      POSTGRES_PASSWORD: popup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popup -d popup_pass"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./backend
    container_name: popup-pass-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "18090:18090"

volumes:
  postgres_data:
